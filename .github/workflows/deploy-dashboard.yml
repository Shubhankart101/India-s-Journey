name: Deploy Interactive Dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docs/**
      - data/chart-latest.json
      - .github/workflows/deploy-dashboard.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble dashboard artifact
        run: |
          mkdir -p site/data
          cp -R docs/. site/
          cp data/chart-latest.json site/data/chart-latest.json
          if [ -f data/substack-latest.json ]; then cp data/substack-latest.json site/data/substack-latest.json; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

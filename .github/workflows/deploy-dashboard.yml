name: Deploy Interactive Dashboard

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Daily PolityPolicy Update
      - Weekly Substack Article Update
      - Weekly Pew Research Update
      - Monthly Economic Review Update
      - NCRB Crime Data Update
      - Election Results Update
      - Historical Election Archive Update
      - Recent Indian Election Data Update
      - Sports Data Update
    types:
      - completed
  push:
    branches: [main]
    paths:
      - docs/**
      - frontend/**
      - scripts/export_static_api.mjs
      - data/catalog.json
      - .github/workflows/deploy-dashboard.yml
      - data/chart-latest.json
      - data/economic-survey-monthly.json
      - data/indian-matrix-latest.json
      - data/substack-latest.json
      - data/pew-india-reports.json
      - data/ncrb-and-analyses.json
      - data/pew-snapshots.json
      - data/election-results.json
      - data/historical-elections.json
      - data/recent-indian-elections.json
      - data/us-campaign-finance.json
      - data/election-indices.json
      - data/sports.json
      - .github/workflows/deploy-dashboard.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run build:static
      - uses: actions/configure-pages@v5
      - name: Assemble static React artifact
        run: |
          mkdir -p site
          cp -R docs/. site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

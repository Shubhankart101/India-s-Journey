name: Deploy Interactive Dashboard

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Daily PolityPolicy Update
      - Weekly Substack Article Update
      - Election Results Update
      - Historical Election Archive Update
      - Recent Indian Election Data Update
    types:
      - completed
  push:
    branches: [main]
    paths:
      - docs/**
      - data/chart-latest.json
      - data/economic-survey-monthly.json
      - data/indian-matrix-latest.json
      - data/substack-latest.json
      - data/pew-india-reports.json
      - data/ncrb-and-analyses.json
      - data/pew-snapshots.json
      - data/election-results.json
      - data/historical-elections.json
      - data/recent-indian-elections.json
      - data/us-campaign-finance.json
      - .github/workflows/deploy-dashboard.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble dashboard artifact
        run: |
          mkdir -p site/data
          cp -R docs/. site/
          cp data/chart-latest.json site/data/chart-latest.json
          if [ -f data/economic-survey-monthly.json ]; then cp data/economic-survey-monthly.json site/data/economic-survey-monthly.json; fi
          if [ -f data/indian-matrix-latest.json ]; then cp data/indian-matrix-latest.json site/data/indian-matrix-latest.json; fi
          if [ -f data/pew-india-reports.json ]; then cp data/pew-india-reports.json site/data/pew-india-reports.json; fi
          if [ -f data/substack-latest.json ]; then cp data/substack-latest.json site/data/substack-latest.json; fi
          if [ -f data/ncrb-and-analyses.json ]; then cp data/ncrb-and-analyses.json site/data/ncrb-and-analyses.json; fi
          if [ -f data/pew-snapshots.json ]; then cp data/pew-snapshots.json site/data/pew-snapshots.json; fi
          if [ -f data/election-results.json ]; then cp data/election-results.json site/data/election-results.json; fi
          if [ -f data/historical-elections.json ]; then cp data/historical-elections.json site/data/historical-elections.json; fi
          if [ -f data/recent-indian-elections.json ]; then cp data/recent-indian-elections.json site/data/recent-indian-elections.json; fi
          if [ -f data/us-campaign-finance.json ]; then cp data/us-campaign-finance.json site/data/us-campaign-finance.json; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

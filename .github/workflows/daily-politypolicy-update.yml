name: Daily PolityPolicy Update

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'

permissions:
  contents: write

concurrency:
  group: daily-public-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dashboard
        uses: actions/checkout@v4

      - name: Check PolityPolicy public endpoint
        run: python scripts/check_site_status.py

      - name: Collect Polity and Policy articles
        run: python scripts/collect_substack.py

      - name: Collect Indian Matrix articles
        run: python scripts/collect_indian_matrix.py

      - name: Refresh FEC candidate campaign-finance data
        run: python scripts/collect_us_campaign_finance.py

      - name: Refresh public-source charts, World Bank layer & JS bundle
        run: python scripts/generate_public_charts.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Export catalogue for the Django app
        run: node scripts/export_catalog.mjs
      - name: Commit daily data and charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/latest-status.json data/substack-latest.json data/indian-matrix-latest.json data/us-campaign-finance.json data/chart-latest.json data/catalog.json frontend/src/data/legacy-aliases.json
          if git diff --cached --quiet; then
            echo "No data change to commit."
            exit 0
          fi
          git commit -m "Refresh daily public data"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

name: Daily PolityPolicy Update

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dashboard
        uses: actions/checkout@v4

      - name: Check PolityPolicy public endpoint
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          url = 'https://politypolicy.com/'
          request = Request(url, headers={'User-Agent': 'PolityPolicyUpdate public monitor'})
          status = 'error'
          error = ''
          try:
              with urlopen(request, timeout=30) as response:
                  status = response.status
          except HTTPError as exc:
              status = exc.code
              error = f'HTTP {exc.code}: {exc.reason}'
          except URLError as exc:
              error = str(exc.reason)

          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat()
          snapshot = {
              'generated_at_utc': now,
              'site': url,
              'homepage_status': status,
              'collection_status': 'ok' if status == 200 else 'partial_or_blocked',
              'collection_errors': [error] if error else [],
          }
          Path('data').mkdir(exist_ok=True)
          Path('data/latest.json').write_text(json.dumps(snapshot, indent=2) + '\n')
          Path('data/latest-status.json').write_text(json.dumps(snapshot, indent=2) + '\n')
          print(json.dumps(snapshot))
          PY

      - name: Refresh public-source charts
        run: python scripts/generate_public_charts.py

      - name: Refresh Economic Survey monthly tables
        run: |
          python -m pip install --quiet pdfplumber openpyxl
          python scripts/fetch_economic_survey_monthly.py

      - name: Commit daily data and charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets
          if git diff --cached --quiet; then
            echo "No data change to commit."
            exit 0
          fi
          git commit -m "Refresh daily public data"
          git push

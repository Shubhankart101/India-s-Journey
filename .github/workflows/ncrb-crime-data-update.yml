name: NCRB Crime Data Update

# NCRB "Crime in India" is an annual publication; a monthly check picks up each new edition.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 1 * *'

permissions:
  contents: write

concurrency:
  group: daily-public-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dashboard
        uses: actions/checkout@v4

      - name: Collect NCRB and analysis data
        run: python scripts/collect_ncrb_and_analyses.py

      - name: Rebuild public chart bundle
        run: python scripts/generate_public_charts.py

      - name: Commit NCRB data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs assets
          if git diff --cached --quiet; then
            echo "No NCRB data change to commit."
            exit 0
          fi
          git commit -m "Refresh NCRB crime data"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

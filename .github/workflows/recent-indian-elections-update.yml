name: Recent Indian Election Data Update

on:
  workflow_dispatch:
  schedule:
    - cron: '15 8 * * *'

permissions:
  contents: write

concurrency:
  group: recent-indian-election-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dashboard
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Collect recent ECI constituency results
        run: |
          python -m pip install --quiet xlrd openpyxl
          python scripts/collect_recent_indian_elections.py
      - name: Build election pie indices
        run: python scripts/build_election_indices.py
      - name: Validate election data
        run: |
          python -m unittest discover -s tests -p 'test_recent_indian_elections.py' -v
          python -m unittest discover -s tests -p 'test_election_indices.py' -v
      - name: Commit refreshed election data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recent-indian-elections.json docs/data/recent-indian-elections.json data/election-indices.json docs/data/election-indices.json
          if git diff --cached --quiet; then
            echo "No recent election data change."
            exit 0
          fi
          git commit -m "Refresh recent Indian election results"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

name: Web app CI

on:
  push:
    branches: [main]
    paths:
      - 'webapp/**'
      - 'frontend/**'
      - 'infra/**'
      - 'scripts/export_catalog.mjs'
      - 'data/catalog.json'
      - 'Dockerfile'
      - 'render.yaml'
      - '.github/workflows/webapp-ci.yml'
  pull_request:
    paths:
      - 'webapp/**'
      - 'frontend/**'
      - 'infra/**'
      - 'scripts/export_catalog.mjs'
      - 'data/catalog.json'
      - 'Dockerfile'
      - 'render.yaml'
      - '.github/workflows/webapp-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webapp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Django tests + OpenAPI schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: webapp/requirements.txt
      - run: pip install -r webapp/requirements.txt
      - name: Django system checks (production settings)
        working-directory: webapp
        env:
          DJANGO_DEBUG: '0'
          DJANGO_SECRET_KEY: ci-only-not-secret-ci-only-not-secret-ci-only-not-secret
        run: python manage.py check --deploy --fail-level ERROR
      - name: Missing migrations
        working-directory: webapp
        run: python manage.py makemigrations --check --dry-run
      - name: Django tests
        working-directory: webapp
        run: python manage.py test indicators -v 2
      - name: OpenAPI schema validates (Swagger)
        working-directory: webapp
        run: python manage.py spectacular --validate --fail-on-warn --file openapi-schema.yml
      - name: Catalogue imports cleanly
        working-directory: webapp
        run: |
          python manage.py migrate --noinput
          python manage.py import_catalog
      - uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: webapp/openapi-schema.yml

  frontend:
    name: React unit tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    name: Playwright end-to-end (desktop + mobile)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: webapp/requirements.txt
      - run: pip install -r ../webapp/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Playwright
        env:
          PYTHON: python
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  terraform:
    name: Terraform fmt / validate / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - name: Format
        run: terraform fmt -check -recursive infra/terraform
      - name: Validate and test (mock providers, no cloud credentials)
        run: |
          set -e
          for dir in infra/terraform/modules/* infra/terraform/environments/*; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            if ls "$dir"/tests/*.tftest.hcl >/dev/null 2>&1; then
              terraform -chdir="$dir" test
            fi
            echo "::endgroup::"
          done

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: indias-journey:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

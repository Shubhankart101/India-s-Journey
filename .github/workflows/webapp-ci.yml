name: Web app CI

on:
  push:
    branches: [main]
    paths: ['webapp/**', 'frontend/**', 'scripts/export_catalog.mjs', 'data/catalog.json', '.github/workflows/webapp-ci.yml']
  pull_request:
    paths: ['webapp/**', 'frontend/**', 'scripts/export_catalog.mjs', 'data/catalog.json']
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: webapp/requirements.txt
      - run: pip install -r webapp/requirements.txt
      - name: Django tests
        working-directory: webapp
        run: python manage.py test indicators
      - name: Catalogue imports cleanly
        working-directory: webapp
        run: |
          python manage.py migrate --noinput
          python manage.py import_catalog

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

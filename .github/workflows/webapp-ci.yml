name: Web app CI

on:
  push:
    branches: [main]
    paths:
      - 'webapp/**'
      - 'frontend/**'
      - 'scripts/export_catalog.mjs'
      - 'data/catalog.json'
      - 'Dockerfile'
      - 'render.yaml'
      - 'fly.toml'
      - '.github/workflows/webapp-ci.yml'
  pull_request:
    paths:
      - 'webapp/**'
      - 'frontend/**'
      - 'scripts/export_catalog.mjs'
      - 'data/catalog.json'
      - 'Dockerfile'
      - 'render.yaml'
      - 'fly.toml'
      - '.github/workflows/webapp-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webapp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Django tests + OpenAPI schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: webapp/requirements.txt
      - run: pip install -r webapp/requirements.txt
      - name: Django system checks (production settings)
        working-directory: webapp
        env:
          DJANGO_DEBUG: '0'
          DJANGO_SECRET_KEY: ci-only-not-secret-ci-only-not-secret-ci-only-not-secret
        run: python manage.py check --deploy --fail-level ERROR
      - name: Missing migrations
        working-directory: webapp
        run: python manage.py makemigrations --check --dry-run
      - name: Django tests
        working-directory: webapp
        run: python manage.py test indicators -v 2
      - name: OpenAPI schema validates (Swagger)
        working-directory: webapp
        run: python manage.py spectacular --validate --fail-on-warn --file openapi-schema.yml
      - name: Catalogue imports cleanly
        working-directory: webapp
        run: |
          python manage.py migrate --noinput
          python manage.py import_catalog
      - uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: webapp/openapi-schema.yml

  frontend:
    name: React unit tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    name: Playwright end-to-end (desktop + mobile)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: webapp/requirements.txt
      - run: pip install -r ../webapp/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Playwright
        env:
          PYTHON: python
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  docker:
    name: Docker image builds and runs in 512 MB (Render / Fly.io)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: indias-journey:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run like the Render / Fly.io free plans
        run: |
          docker run -d --name app -p 8000:8000 --memory 512m --memory-swap 512m \
            -e DJANGO_SECRET_KEY=ci-only-not-secret-ci-only-not-secret-ci-only-not-secret \
            -e WEB_CONCURRENCY=1 -e RENDER_EXTERNAL_HOSTNAME=localhost \
            indias-journey:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/health/ >/dev/null 2>&1; then echo "up after ${i}x2s"; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' app)" != "true" ]; then break; fi
            sleep 2
          done
      - name: Smoke test pages and API
        run: |
          set -e
          curl -fsS http://localhost:8000/api/health/
          echo
          for path in / /explore /compare /sources /api /api/categories/ "/api/indicators/?page_size=1" /api/docs/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8000$path")
            echo "$code $path"
            [ "$code" = "200" ]
          done
          curl -fsS http://localhost:8000/ | grep -q '<div id="root">'
      - name: Memory and OOM check
        if: always()
        run: |
          docker stats --no-stream --format 'memory {{.MemUsage}} ({{.MemPerc}})' app || true
          oom=$(docker inspect -f '{{.State.OOMKilled}}' app)
          echo "OOMKilled=$oom"
          [ "$oom" = "false" ]
      - name: Container logs
        if: always()
        run: docker logs app 2>&1 | tail -n 60

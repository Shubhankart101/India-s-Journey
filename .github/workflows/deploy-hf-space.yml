name: Deploy to Hugging Face Space

# Manual only: Hugging Face requires a PRO subscription for Docker Spaces.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-space-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Upload to the Docker Space
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - name: Skip when no token is configured
        if: env.HF_TOKEN == ''
        run: echo "::notice::Set the HF_TOKEN secret (and optionally the HF_SPACE variable) to deploy to Hugging Face Spaces."
      - uses: actions/checkout@v4
        if: env.HF_TOKEN != ''
      - uses: actions/setup-python@v5
        if: env.HF_TOKEN != ''
        with:
          python-version: '3.12'
      - name: Deploy
        if: env.HF_TOKEN != ''
        run: |
          pip install --quiet huggingface_hub
          python scripts/deploy_hf_space.py ${HF_SPACE:+--space "$HF_SPACE"}

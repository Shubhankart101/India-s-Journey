name: Monthly Economic Review Update

# The Department of Economic Affairs publishes the Monthly Economic Review once a month;
# checking on the 5th, 15th and 25th picks up each issue within days of release.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 5,15,25 * *'

permissions:
  contents: write

concurrency:
  group: daily-public-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dashboard
        uses: actions/checkout@v4

      - name: Refresh Economic Survey monthly tables
        run: |
          python -m pip install --quiet pdfplumber openpyxl
          python scripts/fetch_economic_survey_monthly.py

      - name: Rebuild public chart bundle
        run: |
          python scripts/generate_public_charts.py
          node scripts/export_catalog.mjs

      - name: Commit monthly economic data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs assets
          if git diff --cached --quiet; then
            echo "No monthly economic data change to commit."
            exit 0
          fi
          git commit -m "Refresh Monthly Economic Review data"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

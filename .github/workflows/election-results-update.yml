name: Election Results Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'

permissions:
  contents: write

concurrency:
  group: public-election-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dashboard
        uses: actions/checkout@v4

      - name: Collect ECI and National Archives results
        run: python scripts/collect_election_results.py

      - name: Commit election data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/election-results.json docs/data/election-results.json
          if git diff --cached --quiet; then
            echo "No election data change to commit."
            exit 0
          fi
          git commit -m "Refresh public election results"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

name: Weekly Pew Research Update

# Pew publishes India surveys and reports a few times a year; a weekly check catches new releases.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: write

concurrency:
  group: daily-public-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dashboard
        uses: actions/checkout@v4

      - name: Collect Pew India survey snapshots & report catalog
        run: |
          python scripts/collect_pew_snapshots.py
          python scripts/collect_pew_india_reports.py

      - name: Rebuild public chart bundle
        run: |
          python scripts/generate_public_charts.py
          node scripts/export_catalog.mjs

      - name: Commit Pew data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No Pew data change to commit."
            exit 0
          fi
          git commit -m "Refresh Pew Research India data"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true"><style>.tw{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.rot{transform-box:view-box;transform-origin:0 0;animation:rot 16s linear infinite}
.rot-r{transform-box:view-box;transform-origin:0 0;animation:rot 12s linear infinite reverse}
.rot-slow{transform-box:view-box;transform-origin:0 0;animation:rot 40s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.swing{transform-box:view-box;transform-origin:0 0;animation:swing 5s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
.needle{transform-box:view-box;transform-origin:0 0;animation:needle 7s ease-in-out infinite}
@keyframes needle{0%,100%{transform:rotate(-55deg)}60%{transform:rotate(38deg)}}
.smoke{transform-box:fill-box;transform-origin:center;animation:smoke 8s ease-out infinite;opacity:0}
@keyframes smoke{0%{transform:translate(0,0) scale(.5);opacity:0}20%{opacity:.5}100%{transform:translate(46px,-130px) scale(2);opacity:0}}
.bob{animation:bob 6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(7px)}}
.float{animation:float 7s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-16px)}}
.drift{animation:drift 90s linear infinite}
@keyframes drift{from{transform:translateX(-420px)}to{transform:translateX(1320px)}}
.drive{animation:drive 16s linear infinite}
@keyframes drive{from{transform:translateX(-360px)}to{transform:translateX(1500px)}}
.drive-r{animation:driver 19s linear infinite}
@keyframes driver{from{transform:translateX(1500px)}to{transform:translateX(-360px)}}
.fly{animation:fly 20s linear infinite}
@keyframes fly{from{transform:translate(-360px,50px)}to{transform:translate(1560px,-70px)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 5s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);opacity:.75}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 3.2s ease-out infinite}
@keyframes ping{from{transform:scale(.35);opacity:.9}to{transform:scale(1.7);opacity:0}}
.draw{stroke-dasharray:1000;animation:draw 7s ease-in-out infinite alternate}
@keyframes draw{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
.flow{stroke-dasharray:22 16;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-38}}
.wave{animation:wave 6s ease-in-out infinite}
@keyframes wave{50%{transform:translateX(-30px)}}
.drop{animation:drop 3.5s ease-in infinite}
@keyframes drop{0%{transform:translateY(-60px);opacity:0}25%{opacity:1}80%{transform:translateY(0);opacity:1}100%{transform:translateY(8px);opacity:0}}
.scroll{animation:scroll 14s linear infinite}
@keyframes scroll{to{transform:translateX(-120px)}}
.flag{transform-box:fill-box;transform-origin:left center;animation:flag 2.4s ease-in-out infinite}
@keyframes flag{50%{transform:skewY(7deg) scaleX(.9)}}
.launch{animation:launch 16s cubic-bezier(.55,0,.9,.4) infinite}
@keyframes launch{0%,30%{transform:translateY(0)}100%{transform:translateY(-760px)}}
.flame{transform-box:fill-box;transform-origin:top center;animation:flame .22s ease-in-out infinite alternate}
@keyframes flame{to{transform:scaleY(1.4) scaleX(.85)}}
.sway{transform-box:fill-box;transform-origin:bottom center;animation:sway 6s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(3.5deg)}}
.spark{transform-box:fill-box;transform-origin:center;animation:spark 5s ease-out infinite;opacity:0}
@keyframes spark{0%{transform:scale(.1);opacity:0}8%{opacity:1}60%{transform:scale(1);opacity:.85}100%{transform:scale(1.15) translateY(14px);opacity:0}}
.flash{animation:flash 9s linear infinite;opacity:0}
@keyframes flash{0%,90%,95%,100%{opacity:0}91%,94%{opacity:.95}92.5%{opacity:.15}}
.sky-flash{animation:skyflash 9s linear infinite;opacity:0}
@keyframes skyflash{0%,90%,95%,100%{opacity:0}91%,94%{opacity:.22}}
.shimmer{animation:shimmer 5s ease-in-out infinite}
@keyframes shimmer{50%{opacity:.15;transform:translateX(16px)}}
.glide{animation:glide 70s linear infinite}
@keyframes glide{from{transform:translateX(-380px)}to{transform:translateX(1560px)}}
.glide-r{animation:glider 55s linear infinite}
@keyframes glider{from{transform:translateX(1560px)}to{transform:translateX(-380px)}}
.shoot{animation:shoot 11s ease-in infinite;opacity:0}
@keyframes shoot{0%,86%{transform:translate(0,0);opacity:0}88%{opacity:1}96%,100%{transform:translate(-420px,210px);opacity:0}}
.rain{animation:rain 1.1s linear infinite}
@keyframes rain{from{transform:translate(0,-90px)}to{transform:translate(-26px,120px)}}
.confetti{animation:confetti 7s linear infinite}
@keyframes confetti{from{transform:translateY(-80px) rotate(0)}to{transform:translateY(680px) rotate(540deg)}}
.hop{animation:hop 1.6s cubic-bezier(.3,0,.7,1) infinite alternate}
@keyframes hop{to{transform:translateY(-150px)}}
.pass{animation:pass 3.2s ease-in-out infinite alternate}
@keyframes pass{to{transform:translateX(520px)}}
.beam{transform-box:view-box;transform-origin:0 0;animation:beam 9s ease-in-out infinite}
@keyframes beam{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(18deg)}}
.cheer{animation:cheer 1.4s ease-in-out infinite}
@keyframes cheer{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.smoke,.spark{opacity:.35}.shoot,.flash,.sky-flash{opacity:0}}

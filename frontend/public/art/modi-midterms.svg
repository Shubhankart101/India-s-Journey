<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="popArt">
      <feColorMatrix type="matrix" values="1 0 0 0 0.1  0 0.8 0 0 0.1  0 0 1.2 0 0.2  0 0 0 1 0"/>
    </filter>
  </defs>
  <rect width="600" height="360" fill="url(#bgGrad)"/>
  
  <!-- Pop Art Background Splatter & Halftone -->
  <g opacity="0.25">
    <circle cx="120" cy="80" r="140" fill="#f59e0b"/>
    <circle cx="500" cy="280" r="180" fill="#ef4444"/>
    <path d="M 0,0 L 300,360 L 600,0 Z" fill="#ffffff" opacity="0.1"/>
  </g>

  <!-- Stylized Leader Portrait Silhouettes & Geometric Brushstrokes -->
  <g transform="translate(180, 20)">
    <!-- Aura -->
    <path d="M 120,40 Q 200,20 220,120 Q 240,240 180,300 Q 60,320 20,240 Q -10,120 40,50 Z" fill="#ffffff" opacity="0.15"/>
    
    <!-- Face Silhouette -->
    <path d="M 70,70 Q 140,40 170,90 Q 200,150 180,240 Q 150,290 90,290 Q 40,270 30,200 Q 20,120 70,70 Z" fill="#fde047"/>
    
    <!-- White Beard & Hair (Pop Art Stencil) -->
    <path d="M 40,80 Q 70,30 140,40 Q 190,60 190,120 Q 170,100 150,110 Q 180,180 180,270 Q 140,320 70,310 Q 30,280 40,220 Q 50,190 70,180 Q 30,150 40,80 Z" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>
    
    <!-- Spectacles & Expression -->
    <rect x="75" y="115" width="38" height="28" rx="6" fill="none" stroke="#0f172a" stroke-width="6"/>
    <rect x="135" y="115" width="38" height="28" rx="6" fill="none" stroke="#0f172a" stroke-width="6"/>
    <line x1="113" y1="126" x2="135" y2="126" stroke="#0f172a" stroke-width="6"/>
    
    <!-- Dramatic Shadow Contours -->
    <path d="M 90,165 Q 120,175 150,165" stroke="#0f172a" stroke-width="5" fill="none"/>
    <path d="M 85,200 Q 120,220 155,200" stroke="#0f172a" stroke-width="6" fill="none"/>
    
    <!-- Kurta / Waistcoat Collar -->
    <path d="M 30,290 L 90,270 L 150,270 L 210,290 L 230,340 L 10,340 Z" fill="#b91c1c" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Editorial Typography Watermark -->
  <text x="32" y="325" fill="#ffffff" font-family="'Playfair Display', Georgia, serif" font-weight="800" font-size="28" letter-spacing="1">POLITY &amp; POLICY</text>
  <text x="32" y="345" fill="#fde047" font-family="sans-serif" font-weight="700" font-size="12" letter-spacing="3">ESSAY · POLITICAL ECONOMY</text>
</svg>

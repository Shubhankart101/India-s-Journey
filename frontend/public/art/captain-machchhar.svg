<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <radialGradient id="sunburst" cx="70%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="40%" stop-color="#ea580c"/>
      <stop offset="80%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
  </defs>
  <rect width="600" height="360" fill="url(#sunburst)"/>

  <!-- Dramatic Silhouette Crowd Reaching Out (Left) -->
  <g fill="#18181b">
    <circle cx="60" cy="190" r="28"/>
    <path d="M 30,220 Q 60,180 90,220 L 90,360 L 30,360 Z"/>
    
    <circle cx="120" cy="160" r="26"/>
    <path d="M 90,190 Q 120,150 150,190 L 150,360 L 90,360 Z"/>

    <circle cx="180" cy="180" r="28"/>
    <path d="M 150,210 Q 180,170 210,210 L 210,360 L 150,360 Z"/>

    <!-- Reaching hands -->
    <path d="M 140,160 L 250,140 L 255,148 L 145,172 Z" fill="#27272a"/>
    <path d="M 170,180 L 280,160 L 284,168 L 174,192 Z" fill="#27272a"/>
    <path d="M 190,220 L 310,190 L 314,198 L 194,232 Z" fill="#27272a"/>
  </g>

  <!-- Superhero / Captain Figure (Right) - Inspired by Man of Steel composition -->
  <g transform="translate(330, 20)">
    <!-- Aura / Light Flare -->
    <circle cx="130" cy="110" r="90" fill="#fef08a" opacity="0.3"/>

    <!-- Cape &amp; Shoulders (Crimson &amp; Dark Suit) -->
    <path d="M 40,140 Q 120,100 200,150 L 220,340 L 20,340 Z" fill="#b91c1c"/>
    <path d="M 60,130 L 120,110 L 180,130 L 190,240 L 50,240 Z" fill="#1e293b"/>

    <!-- Head &amp; Heroic Profile -->
    <circle cx="120" cy="70" r="32" fill="#fed7aa"/>
    <!-- Well-groomed hair and beard -->
    <path d="M 95,65 Q 120,35 150,55 Q 155,85 145,100 Q 130,110 110,105 Q 90,100 95,65 Z" fill="#1c1917"/>

    <!-- Extended Protective Arm (Holding Back Crowd with Quiet Strength) -->
    <path d="M 70,140 L -60,170 L -65,158 L 65,130 Z" fill="#1e293b"/>
    <!-- Hand -->
    <circle cx="-62" cy="164" r="14" fill="#fed7aa"/>
  </g>

  <!-- Watermark -->
  <text x="32" y="325" fill="#ffffff" font-family="'Playfair Display', Georgia, serif" font-weight="800" font-size="24">POLITY &amp; POLICY</text>
  <text x="32" y="345" fill="#fbbf24" font-family="sans-serif" font-weight="700" font-size="11" letter-spacing="3">PROFILE · ESSAY</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="streetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="60%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="taxiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#streetGrad)"/>

  <!-- Yellow & Black Auto/Taxi in Background -->
  <g transform="translate(40, 90)">
    <rect x="0" y="40" width="160" height="90" rx="16" fill="url(#taxiGrad)"/>
    <path d="M 20,40 L 50,0 L 130,0 L 150,40 Z" fill="#0f172a"/>
    <rect x="25" y="8" width="45" height="30" fill="#93c5fd" opacity="0.8"/>
    <rect x="80" y="8" width="55" height="30" fill="#93c5fd" opacity="0.8"/>
    <circle cx="35" cy="130" r="22" fill="#0f172a" stroke="#64748b" stroke-width="4"/>
    <circle cx="125" cy="130" r="22" fill="#0f172a" stroke="#64748b" stroke-width="4"/>
  </g>

  <!-- Yellow Barricade (Delhi Police Signature) -->
  <g transform="translate(140, 160)">
    <rect x="0" y="20" width="140" height="70" rx="6" fill="#facc15" stroke="#ca8a04" stroke-width="3"/>
    <rect x="10" y="30" width="120" height="20" fill="#ca8a04"/>
    <text x="70" y="45" fill="#0f172a" font-family="sans-serif" font-weight="900" font-size="11" text-anchor="middle" letter-spacing="2">DELHI POLICE</text>
    <line x1="20" y1="90" x2="10" y2="140" stroke="#475569" stroke-width="6"/>
    <line x1="120" y1="90" x2="130" y2="140" stroke="#475569" stroke-width="6"/>
  </g>

  <!-- Khaki Police Personnel Silhouettes & Crowd Control Action -->
  <g transform="translate(260, 40)">
    <!-- Officer 1 -->
    <path d="M 50,70 Q 70,50 90,70 L 90,140 L 110,240 L 80,240 L 70,160 L 60,240 L 30,240 L 50,140 Z" fill="#d97706" stroke="#92400e" stroke-width="2"/>
    <circle cx="70" cy="45" r="18" fill="#d97706"/>
    <!-- Police Cap / Beret -->
    <path d="M 50,40 Q 70,25 92,35 L 94,44 L 48,44 Z" fill="#1e3a8a"/>

    <!-- Officer 2 (Flank) -->
    <path d="M 120,80 Q 140,60 160,80 L 160,150 L 180,240 L 150,240 L 140,170 L 130,240 L 100,240 L 120,150 Z" fill="#b45309"/>
    <circle cx="140" cy="55" r="18" fill="#b45309"/>
    <path d="M 120,50 Q 140,35 162,45 L 164,54 L 118,54 Z" fill="#991b1b"/>

    <!-- Crowd / Detainee Vector -->
    <path d="M 180,110 Q 200,90 220,110 L 220,180 L 240,240 L 210,240 L 200,190 L 190,240 L 160,240 L 180,180 Z" fill="#64748b"/>
    <circle cx="200" cy="85" r="16" fill="#94a3b8"/>

    <!-- Officer 3 (Right) -->
    <path d="M 230,70 Q 250,50 270,70 L 270,140 L 290,240 L 260,240 L 250,160 L 240,240 L 210,240 L 230,140 Z" fill="#d97706"/>
    <circle cx="250" cy="45" r="18" fill="#d97706"/>
    <path d="M 230,40 Q 250,25 272,35 L 274,44 L 228,44 Z" fill="#1e3a8a"/>
  </g>

  <!-- Green Lush Hedges at bottom -->
  <path d="M 0,280 Q 150,250 300,270 Q 450,250 600,270 L 600,360 L 0,360 Z" fill="#15803d"/>
  <path d="M 0,300 Q 180,270 360,290 Q 500,280 600,295 L 600,360 L 0,360 Z" fill="#166534"/>

  <!-- Watermark -->
  <text x="32" y="325" fill="#ffffff" font-family="'Playfair Display', Georgia, serif" font-weight="800" font-size="24">POLITY &amp; POLICY</text>
  <text x="32" y="345" fill="#facc15" font-family="sans-serif" font-weight="700" font-size="11" letter-spacing="3">STATE &amp; PUBLIC ORDER</text>
</svg>

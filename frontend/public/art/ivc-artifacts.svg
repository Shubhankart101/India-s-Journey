<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#422517"/>
      <stop offset="60%" stop-color="#24140b"/>
      <stop offset="100%" stop-color="#120904"/>
    </radialGradient>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8c6239"/>
      <stop offset="50%" stop-color="#54371e"/>
      <stop offset="100%" stop-color="#2b1a0d"/>
    </linearGradient>
    <linearGradient id="steatiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0ece1"/>
      <stop offset="50%" stop-color="#c9beaa"/>
      <stop offset="100%" stop-color="#8c816c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGlow)"/>

  <!-- Steatite Seal Outline on Left (Pashupati Seal Style) -->
  <g transform="translate(100, 150)">
    <rect width="280" height="280" rx="14" fill="#2d2218" stroke="#8a5b30" stroke-width="4"/>
    <!-- Seal Inscription at Top -->
    <path d="M40 50 Q60 30 80 50 Q60 70 40 50 Z M80 50 L95 38 L95 62 Z" fill="none" stroke="#d4a72c" stroke-width="2.5"/>
    <path d="M120 35 L145 35 L148 65 Q132 75 117 65 Z" fill="none" stroke="#d4a72c" stroke-width="2.5"/>
    <circle cx="180" cy="50" r="14" fill="none" stroke="#d4a72c" stroke-width="2.5"/>
    <line x1="180" y1="36" x2="180" y2="64" stroke="#d4a72c" stroke-width="2"/>
    <line x1="166" y1="50" x2="194" y2="50" stroke="#d4a72c" stroke-width="2"/>
    <path d="M220 35 L245 65 M245 35 L220 65" stroke="#d4a72c" stroke-width="2.5"/>

    <!-- Seated Horned Deity (Proto-Shiva) -->
    <!-- Head with Horned Headdress -->
    <circle cx="140" cy="115" r="18" fill="#a87944"/>
    <path d="M110 95 Q140 120 170 95" fill="none" stroke="#d4a72c" stroke-width="5"/>
    <path d="M95 85 Q115 105 130 115" fill="none" stroke="#d4a72c" stroke-width="4"/>
    <path d="M185 85 Q165 105 150 115" fill="none" stroke="#d4a72c" stroke-width="4"/>
    <!-- Body in Yogic Asana -->
    <path d="M115 135 L165 135 L175 190 L105 190 Z" fill="#8a5b30"/>
    <!-- Folded Legs (Yogic Padmasana) -->
    <path d="M85 220 Q140 240 195 220 L180 190 L100 190 Z" fill="#6e4520"/>
    <!-- Arms with Bangles -->
    <path d="M115 140 L85 180 L105 190" fill="none" stroke="#a87944" stroke-width="6"/>
    <path d="M165 140 L195 180 L175 190" fill="none" stroke="#a87944" stroke-width="6"/>

    <!-- Flanking Animals: Elephant, Tiger, Rhino, Buffalo -->
    <circle cx="50" cy="110" r="10" fill="#a87944" opacity="0.6"/>
    <circle cx="230" cy="110" r="10" fill="#a87944" opacity="0.6"/>
  </g>

  <!-- Priest-King of Mohenjo-daro (Center) -->
  <g transform="translate(460, 100)">
    <!-- Base plinth -->
    <rect x="30" y="550" width="220" height="40" fill="#38291c" rx="6"/>
    <!-- Torso and Robe -->
    <path d="M40 380 Q90 320 140 320 Q190 320 240 380 L250 550 L30 550 Z" fill="url(#steatiteGrad)"/>
    <!-- Trefoil Pattern on Shawl (Three-lobed floral emblem) -->
    <g fill="#9e352b" opacity="0.85">
      <circle cx="70" cy="400" r="10"/><circle cx="85" cy="400" r="10"/><circle cx="78" cy="385" r="10"/>
      <circle cx="110" cy="450" r="10"/><circle cx="125" cy="450" r="10"/><circle cx="118" cy="435" r="10"/>
      <circle cx="160" cy="410" r="10"/><circle cx="175" cy="410" r="10"/><circle cx="168" cy="395" r="10"/>
      <circle cx="70" cy="490" r="10"/><circle cx="85" cy="490" r="10"/><circle cx="78" cy="475" r="10"/>
      <circle cx="150" cy="500" r="10"/><circle cx="165" cy="500" r="10"/><circle cx="158" cy="485" r="10"/>
    </g>
    <!-- Neck -->
    <rect x="110" y="270" width="60" height="60" fill="#c9beaa"/>
    <!-- Head &amp; Beard -->
    <path d="M95 160 Q140 130 185 160 L180 280 Q140 310 100 280 Z" fill="url(#steatiteGrad)"/>
    <!-- Stylized Beard with Horizontal Incised Lines -->
    <path d="M100 230 Q140 250 180 230 L175 285 Q140 305 105 285 Z" fill="#a89a84"/>
    <line x1="108" y1="245" x2="172" y2="245" stroke="#786c58" stroke-width="1.5"/>
    <line x1="106" y1="255" x2="174" y2="255" stroke="#786c58" stroke-width="1.5"/>
    <line x1="110" y1="265" x2="170" y2="265" stroke="#786c58" stroke-width="1.5"/>
    <line x1="115" y1="275" x2="165" y2="275" stroke="#786c58" stroke-width="1.5"/>
    <!-- Closed Contemplative Eyes with Shell Inlay shape -->
    <ellipse cx="120" cy="195" rx="14" ry="5" fill="#544c3d"/>
    <ellipse cx="160" cy="195" rx="14" ry="5" fill="#544c3d"/>
    <!-- Fillet / Diadem on Forehead with Round Medallion -->
    <rect x="94" y="160" width="92" height="12" fill="#d4a72c"/>
    <circle cx="140" cy="166" r="10" fill="#ffdf7a" stroke="#a87920" stroke-width="2"/>
    <!-- Armlet with Matching Medallion -->
    <rect x="42" y="390" width="16" height="30" fill="#d4a72c"/>
    <circle cx="50" cy="405" r="8" fill="#ffdf7a"/>
  </g>

  <!-- Bronze Dancing Girl of Mohenjo-daro (Right) -->
  <g transform="translate(860, 120)">
    <!-- Lost-wax bronze silhouette -->
    <!-- Head tilted proudly backward, bun in hair -->
    <ellipse cx="120" cy="120" rx="20" ry="24" fill="url(#bronzeGrad)"/>
    <!-- Huge coiled hair bun on right -->
    <circle cx="150" cy="125" r="22" fill="#3a2213"/>
    <!-- Long slender neck with necklace of beads and amulet -->
    <rect x="110" y="140" width="18" height="40" fill="url(#bronzeGrad)" transform="rotate(-5 110 140)"/>
    <circle cx="118" cy="175" r="6" fill="#d4a72c"/>
    <!-- Torso standing in contrapposto posture -->
    <path d="M100 180 Q125 185 135 220 L125 320 Q105 320 95 280 Z" fill="url(#bronzeGrad)"/>
    <!-- Left Hand Resting on Hip (Bangles covering entire left arm!) -->
    <path d="M102 185 L70 240 L85 285" fill="none" stroke="#4a2e16" stroke-width="12" stroke-linecap="round"/>
    <!-- 25 Bangles completely covering the left arm from shoulder to wrist -->
    <g stroke="#e0a050" stroke-width="2">
      <line x1="95" y1="195" x2="105" y2="195"/>
      <line x1="90" y1="205" x2="100" y2="205"/>
      <line x1="85" y1="215" x2="95" y2="215"/>
      <line x1="80" y1="225" x2="90" y2="225"/>
      <line x1="75" y1="235" x2="85" y2="235"/>
      <line x1="73" y1="245" x2="83" y2="245"/>
      <line x1="75" y1="255" x2="85" y2="255"/>
      <line x1="78" y1="265" x2="88" y2="265"/>
      <line x1="82" y1="275" x2="92" y2="275"/>
    </g>
    <!-- Right Arm bent forward, resting on right thigh -->
    <path d="M130 190 L160 250 L140 330" fill="none" stroke="#4a2e16" stroke-width="11" stroke-linecap="round"/>
    <!-- Right wrist bangles -->
    <line x1="135" y1="315" x2="148" y2="315" stroke="#e0a050" stroke-width="3"/>
    <line x1="137" y1="322" x2="149" y2="322" stroke="#e0a050" stroke-width="3"/>
    <!-- Slender Legs in Confident Stance -->
    <!-- Right Leg bent slightly forward -->
    <path d="M125 320 L135 450 L130 550" fill="none" stroke="url(#bronzeGrad)" stroke-width="14" stroke-linecap="round"/>
    <!-- Left Leg straight supporting weight -->
    <path d="M105 320 L95 450 L95 550" fill="none" stroke="url(#bronzeGrad)" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- Carnelian Beads Necklace &amp; Chert Cubical Weights in Foreground -->
  <g transform="translate(180, 560)">
    <!-- Standardized Indus Cubical Chert Weights -->
    <rect x="0" y="40" width="50" height="50" fill="#d4cbb8" stroke="#8c826e" stroke-width="3" rx="4"/>
    <text x="25" y="70" font-size="12" font-family="sans-serif" font-weight="700" fill="#5a5242" text-anchor="middle">13.7g</text>
    <rect x="70" y="55" width="35" height="35" fill="#d4cbb8" stroke="#8c826e" stroke-width="2.5" rx="3"/>
    <rect x="120" y="65" width="25" height="25" fill="#d4cbb8" stroke="#8c826e" stroke-width="2" rx="2"/>

    <!-- Etched Carnelian Beads (Red with bleached white patterns - found in Mesopotamia!) -->
    <g>
      <ellipse cx="220" cy="70" rx="30" ry="12" fill="#c43b18" stroke="#ffffff" stroke-width="2.5"/>
      <ellipse cx="290" cy="70" rx="25" ry="11" fill="#c43b18" stroke="#ffffff" stroke-width="2.5"/>
      <ellipse cx="350" cy="70" rx="20" ry="10" fill="#c43b18" stroke="#ffffff" stroke-width="2.5"/>
      <line x1="180" y1="70" x2="380" y2="70" stroke="#ffaa66" stroke-width="1.5" stroke-dasharray="3,3"/>
    </g>
  </g>
</svg>

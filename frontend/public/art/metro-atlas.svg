  <!-- Bottom vignette and title -->
  <rect width="1200" height="600" fill="url(#lower_metro_atlas)"/>
  <text x="600" y="495" text-anchor="middle" font-family="Arial, -apple-system, sans-serif" font-size="30" font-weight="800" letter-spacing=".5" fill="#f8fafc">Indian Metro Networks &amp; Transit Atlas</text>
  <text x="600" y="538" text-anchor="middle" font-family="Arial, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#38bdf8" opacity=".95">17 CITIES • 1,042 KM ACTIVE TRANSIT • DIJKSTRA ROUTING</text>

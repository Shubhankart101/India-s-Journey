# fly.toml app configuration file generated for india-s-journey on 2026-11-03T19:52:18Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'india-s-journey'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  DJANGO_LOG_LEVEL = 'INFO'
  PORT = '8000'
  WEB_CONCURRENCY = '1'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 60
    soft_limit = 40

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '1m0s'
    method = 'GET'
    path = '/api/health/'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

# Fly.io config for the Django + React web app. First deploy: `fly launch --no-deploy --copy-config`,
# then `fly secrets set DJANGO_SECRET_KEY=<random>` and `fly deploy`. Fly injects FLY_APP_NAME, which
# settings.py turns into <app>.fly.dev for ALLOWED_HOSTS and CSRF_TRUSTED_ORIGINS.
app = "india-s-journey"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  WEB_CONCURRENCY = "1"
  DJANGO_LOG_LEVEL = "INFO"

[http_service]
  internal_port = 8000
  force_https = true
  # Stop idle machines so you only pay while someone is using the app.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 60

  [[http_service.checks]]
    method = "GET"
    path = "/api/health/"
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"

    [http_service.checks.headers]
      Host = "india-s-journey.fly.dev"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

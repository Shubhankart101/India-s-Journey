# Build the static React app into docs/, the same publication root used by GitHub Pages.
[build]
  publish = "docs"
  command = "npm ci --prefix frontend && npm --prefix frontend run build:static"

[build.processing]
  skip_processing = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/build/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
